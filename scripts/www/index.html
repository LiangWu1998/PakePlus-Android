      let entry = null, preferenceError = null;
      if (remember) try { entry = await preferences().save(store.root, store.data.libraryId, store.displayName); } catch (error) { preferenceError = error; }
      return { store, entry, preferenceError };
    });
    if (result.ok) {
      if (remember) ui.startup = result.value.preferenceError ? { entry:null, state:"error", issue:"本次已连接，但启动设置未能确认：" + startupError(result.value.preferenceError) } : { entry:result.value.entry, state:"saved", issue:"" };
      else if (ui.startup.state === "connected") ui.startup.state = "saved";
      activateStore(result.value.store, false);
      if (result.value.preferenceError) { navigate("#/settings"); toast(ui.startup.issue); }
      else toast(ui.store.recovery ? "已只读打开上一份记录，请先恢复数据" : remember ? "启动文件夹已记住，重开时会自动尝试连接" : "数据文件夹已连接");
    } else if (remember && ui.startup.state === "loading") { ui.startup = { entry:null, state:"off", issue:"" }; loadStartup(); }
  }
  async function backup() {
    if (!requireStore() || !pickerAvailable()) return; if (ui.store.isDemo) { toast("请连接正式数据文件夹后再制作备份。"); return; }
    const result = await task("制作完整备份…", async () => { const parent = await window.showDirectoryPicker({ mode:"readwrite", id:"item-shelf-backup" }); return ui.store.backup(parent,progress); });
    if (result.ok) toast("完整备份已完成：" + result.value);
  }
  async function restore() {
    if (!requireStore() || !pickerAvailable()) return; if (ui.store.isDemo) { toast("请先连接正式数据文件夹。"); return; }
    const inspected = await task("读取备份信息…", async () => { const dir = await window.showDirectoryPicker({ mode:"read", id:"item-shelf-restore" }); return C.inspectBackup(dir); });
    if (!inspected.ok) return;
    const snapshot = inspected.value, inner = openDialog("从完整备份恢复","请选择具体的“物品备份-…”文件夹，而不是它的上级目录。"); if (!inner) return;
    inner.append(el("p", { text:"备份包含 " + snapshot.data.majorCategories.length + " 个大分类、" + snapshot.data.minorCategories.length + " 个小分类、" + snapshot.data.items.length + " 件物品（含回收站）。" }),el("p", { class:"form-note", style:"margin-top:12px", text:"备份时间：" + new Date(snapshot.marker.createdAt).toLocaleString("zh-CN") + "。恢复会替换当前清单；开始前会自动制作当前清单的完整安全备份，任一图片校验失败都会停止恢复。" }));
    const confirm = el("input", { type:"text", placeholder:"输入“恢复”确认" }); inner.append(field("确认整库恢复",confirm),errorBox(),el("div", { class:"form-actions" }, [button("取消", () => closeDialog()),button("开始恢复", async () => {
      if (confirm.value.trim() !== "恢复") { formError("请先输入“恢复”确认整库替换。"); return; }
      const result = await task("校验图片并恢复备份…", () => ui.store.restore(snapshot,progress));
      if (result.ok) { closeDialog(true); ui.filterMajor = ""; ui.filterLocation = ""; navigate("#/home"); render(); toast("恢复完成，恢复前的清单已保留在 safety-backups 中"); }
    }, "primary")]));
  }
  async function clean() {
    if (!requireStore() || ui.store.isDemo) { toast("请先连接正式数据文件夹。"); return; }
    if (!window.confirm("清理当前数据和上一份记录均未引用的图片？当前物品、回收站和完整备份中的图片会保留。")) return;
    const result = await task("检查并清理未引用图片…", () => ui.store.cleanUnused()); if (result.ok) toast("已清理 " + result.value + " 个未引用图片文件");
  }
  async function demoPicture(kind,color) {
    const canvas = document.createElement("canvas"); canvas.width = 400; canvas.height = 400; const ctx = canvas.getContext("2d");
    ctx.fillStyle = color; ctx.fillRect(0,0,400,400); ctx.fillStyle = "#0000000a"; ctx.beginPath(); ctx.ellipse(200,335,95,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = kind === "shirt" ? "#b8a58a" : kind === "shoe" ? "#eeeadd" : kind === "book" ? "#547361" : "#718181"; ctx.strokeStyle = "#35463445"; ctx.lineWidth = 3;
    if (kind === "shirt") { ctx.beginPath(); ctx.moveTo(145,91);ctx.lineTo(86,131);ctx.lineTo(115,193);ctx.lineTo(145,174);ctx.lineTo(145,310);ctx.lineTo(255,310);ctx.lineTo(255,174);ctx.lineTo(285,193);ctx.lineTo(314,131);ctx.lineTo(255,91);ctx.quadraticCurveTo(200,136,145,91);ctx.fill();ctx.stroke();ctx.strokeStyle="#88785b60";for(let x=160;x<251;x+=11){ctx.beginPath();ctx.moveTo(x,153);ctx.lineTo(x,300);ctx.stroke();} }
    else if (kind === "shoe") { ctx.beginPath();ctx.moveTo(85,210);ctx.lineTo(108,153);ctx.lineTo(169,182);ctx.lineTo(201,235);ctx.lineTo(300,264);ctx.quadraticCurveTo(331,281,316,304);ctx.lineTo(80,304);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle="#9eaa9a";ctx.beginPath();ctx.moveTo(90,285);ctx.lineTo(314,285);ctx.moveTo(180,216);ctx.lineTo(212,202);ctx.moveTo(190,233);ctx.lineTo(223,218);ctx.stroke(); }
    else if (kind === "book") { ctx.fillRect(115,85,173,235);ctx.fillStyle="#e9e6cf";ctx.fillRect(116,296,170,16);ctx.fillStyle="#ffffffa0";ctx.fillRect(141,124,121,3);ctx.fillRect(141,146,80,3);ctx.fillRect(141,247,45,2); }
    else { ctx.fillRect(109,124,183,182);ctx.fillStyle="#d2dbd4";ctx.fillRect(126,142,149,128);ctx.strokeRect(109,124,183,182);ctx.strokeStyle="#5b6a5c";ctx.beginPath();ctx.arc(200,130,55,Math.PI,0);ctx.stroke(); }
    return new Promise(resolve => canvas.toBlob(resolve,"image/png"));
  }
  async function startDemo() {
    if (ui.store && !window.confirm("进入示例会暂时离开当前清单，已保存的文件不会改变。继续吗？")) return;
    ui.connectionEpoch++;
    const result = await task("准备示例物品…", async () => {
      const store = new C.MemoryStore(); let clothing,shoes,books,tools,sweaters,coats,sport,reading,small;
      await store.transact(d => { clothing=C.Ops.addMajor(d,"衣服");shoes=C.Ops.addMajor(d,"鞋子");books=C.Ops.addMajor(d,"书籍");tools=C.Ops.addMajor(d,"随身与工具");sweaters=C.Ops.addMinor(d,clothing,"毛衣");coats=C.Ops.addMinor(d,clothing,"外套");sport=C.Ops.addMinor(d,shoes,"运动鞋");reading=C.Ops.addMinor(d,books,"正在阅读");small=C.Ops.addMinor(d,tools,"常用小物"); });
      const samples = [["米色羊毛毛衣",sweaters,"卧室衣柜第二层","shirt","#eeebe2"],["深色针织毛衣",sweaters,"卧室衣柜第二层","shirt","#e1e8de"],["秋日轻薄外套",coats,"玄关衣架","shirt","#e5e8df"],["白色日常运动鞋",sport,"玄关鞋柜","shoe","#e9e5dc"],["周末跑步鞋",sport,"玄关鞋柜","shoe","#dde7e1"],["日常阅读笔记",reading,"书桌左侧","book","#e5e7dc"],["随身收纳包",small,"书桌抽屉","bag","#e7e3db"],["常用工具盒",small,"储物柜上层","bag","#e0e8e6"]];
      for (const [title,minorId,location,kind,color] of samples) { const blob = await demoPicture(kind,color); const image={original:{blob,extension:"png"},thumbnail:{blob,extension:"png"},sourceName:"示例插画.png"}; await store.transact((d,photo)=>C.Ops.saveItem(d,{title,minorId,location,description:"这是一件用于体验界面和搜索的示例物品。",image:photo}),image); }
      return store;
    });
    if (result.ok) { ui.store=result.value;ui.query="";$("search").value="";ui.filterMajor="";ui.filterLocation="";navigate("#/home");render(); }
  }
  for (const node of document.querySelectorAll("[data-icon]")) node.replaceWith(icon(node.dataset.icon));
  for (const node of document.querySelectorAll("[data-route]")) node.addEventListener("click",()=>{ui.query="";$("search").value="";ui.filterMajor="";ui.filterLocation="";navigate("#/"+node.dataset.route);});
  $("top-add").addEventListener("click",()=>itemDialog()); $("sidebar-connect").addEventListener("click",connect);
  $("startup-resume").addEventListener("click",()=>resumeStartup(true)); $("startup-settings").addEventListener("click",()=>navigate("#/settings"));
  const search = () => { if(ui.composing)return; clearTimeout(ui.searchTimer);ui.searchTimer=setTimeout(()=>{ui.query=$("search").value;ui.limit=24;if(location.hash!=="#/search"){ui.filterMajor="";ui.filterLocation="";navigate("#/search");}else render();},180); };
  $("search").addEventListener("input",search); $("search").addEventListener("compositionstart",()=>{ui.composing=true;});$("search").addEventListener("compositionend",()=>{ui.composing=false;search();});
  $("clear-search").addEventListener("click",()=>{clearTimeout(ui.searchTimer);ui.query="";$("search").value="";navigate("#/all");$("search").focus();});
  $("dialog").addEventListener("cancel",event=>{event.preventDefault();closeDialog();});
  $("recover-previous").addEventListener("click",async()=>{if(!ui.store||!ui.store.recovery)return;if(!window.confirm("恢复上一份记录？最新一次未完成或损坏的变更可能不在其中，现有异常文件会另存保留。"))return;const result=await task("恢复上一份记录…",()=>ui.store.recoverPrevious());if(result.ok){render();toast("上一份记录已恢复，可以继续编辑");}});
  window.addEventListener("hashchange",()=>{
    if(ui.busy){history.replaceState(null,"",ui.lastHash);return;}
    if($("dialog").open&&!closeDialog()){history.replaceState(null,"",ui.lastHash);return;}
    ui.lastHash=location.hash||"#/home";render();requestAnimationFrame(()=>window.scrollTo(0,ui.scroll.get(ui.lastHash)||0));
  });
  window.addEventListener("beforeunload",event=>{if(ui.busy||ui.dialogDirty){event.preventDefault();event.returnValue="";}});
  render();
  loadStartup();
})();
</script>
